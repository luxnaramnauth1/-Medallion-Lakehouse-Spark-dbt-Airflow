version: 2

models:
  - name: dim_customers
    description: Current customer dimension (latest record per customer).
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: country
        tests: [not_null]

  - name: dim_products
    description: Product dimension.
    columns:
      - name: product_id
        tests: [unique, not_null]
      - name: list_price
        tests: [not_null]

  - name: fct_order_items
    description: Order-line fact table, one row per line item.
    columns:
      - name: order_item_id
        tests: [unique, not_null]
      - name: customer_id
        tests:
          - not_null
          - relationships: {to: ref('dim_customers'), field: customer_id}
      - name: product_id
        tests:
          - not_null
          - relationships: {to: ref('dim_products'), field: product_id}
      - name: status
        tests:
          - accepted_values:
              values: [placed, shipped, completed, cancelled, returned]
      - name: quantity
        tests: [not_null]

  - name: agg_daily_sales
    description: Daily net revenue KPIs.
    columns:
      - name: order_date
        tests: [unique, not_null]

  - name: agg_sales_by_category
    description: Daily net revenue by product category.

  - name: agg_customer_ltv
    description: Customer lifetime value and value segment.
    columns:
      - name: customer_id
        tests: [unique, not_null]
      - name: value_segment
        tests:
          - accepted_values:
              values: [high, mid, low]
