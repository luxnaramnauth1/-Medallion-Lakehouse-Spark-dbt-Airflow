name: lakehouse
version: "1.0.0"
config-version: 2
profile: lakehouse

model-paths: ["models"]
macro-paths: ["macros"]

on-run-start:
  - "{{ register_silver_tables() }}"

models:
  lakehouse:
    +file_format: delta
    +location_root: /opt/lakehouse/gold
    gold:
      +materialized: table
      +schema: gold
